name: Build Hsbty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Extract project
        run: unzip -o Hsbty-Android-ready.zip -d project

      - name: Install dependencies
        working-directory: project/Hsbty-dr-mly-shkhSy
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        working-directory: project/Hsbty-dr-mly-shkhSy
        run: pnpm --filter @workspace/hesabati build

      - name: Prepare Android
        working-directory: project/Hsbty-dr-mly-shkhSy
        run: |
          cd artifacts/hesabati
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: project/Hsbty-dr-mly-shkhSy/artifacts/hesabati/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hsbty-APK
          path: project/Hsbty-dr-mly-shkhSy/artifacts/hesabati/android/app/build/outputs/apk/debug/app-debug.apk
          
